
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create user · Mailcheck</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fc;
      --panel: #ffffff;
      --ink: #182230;
      --muted: #667085;
      --line: #e5e9f2;
      --accent: #6558e8;
      --accent-hover: #5145cf;
      --good: #16845b;
      --bad: #c23c52;
      --shadow: 0 12px 34px rgba(31, 42, 68, .06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          ellipse at 10% 0%,
          rgba(101, 88, 232, .08),
          transparent 36rem
        ),
        var(--bg);
      color: var(--ink);
      font: 15px/1.55 Inter, ui-sans-serif, system-ui,
        -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
    }

    main {
      width: min(520px, 100%);
      margin: auto;
      padding: 42px 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 30px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border-radius: 15px;
      color: #fff;
      font-size: 21px;
      font-weight: 800;
      background: linear-gradient(145deg, #8176ff, #594bd7);
      box-shadow: 0 8px 18px rgba(101, 88, 232, .22);
    }

    h1 {
      font-size: clamp(27px, 4vw, 34px);
      line-height: 1.15;
      margin: 0 0 5px;
      letter-spacing: -.04em;
    }

    h2 {
      font-size: 19px;
      line-height: 1.3;
      letter-spacing: -.02em;
      margin: 0 0 8px;
    }

    .sub {
      color: var(--muted);
      margin: 0;
      font-size: 15px;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: clamp(20px, 5vw, 30px);
      box-shadow: var(--shadow);
    }

    .section-intro {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 650;
      color: #475467;
      margin: 15px 0 7px;
    }

    input {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 12px 14px;
      font: inherit;
      font-size: 15px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #d9dfeb;
      border-radius: 11px;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }

    input::placeholder {
      color: #98a2b3;
    }

    input:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(101, 88, 232, .12);
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px 16px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
      border: 1px solid transparent;
      border-radius: 11px;
      transition: background .18s, transform .18s, box-shadow .18s;
    }

    button:hover {
      background: var(--accent-hover);
      box-shadow: 0 5px 14px rgba(101, 88, 232, .18);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
      box-shadow: none;
    }

    button:focus-visible {
      outline: 3px solid rgba(101, 88, 232, .3);
      outline-offset: 3px;
    }

    .msg {
      min-height: 22px;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--good);
      overflow-wrap: anywhere;
    }

    .msg.err {
      color: var(--bad);
    }

    .back-link {
      display: inline-block;
      margin-top: 0px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
    }
    
    .back-link:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      main {
        padding: 28px 16px;
      }

      section {
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">M</div>
      <div>
        <h1>Mailcheck</h1>
        <p class="sub">Email verification, made clear and simple.</p>
      </div>
    </header>

    <section>
      <h2>Create user</h2>
      <p class="section-intro">
        Create an account using your administrator key.
      </p>

      <form id="createForm">
        <label for="key">Admin key</label>
        <input
          id="key"
          type="password"
          autocomplete="off"
          placeholder="Enter administrator key"
          required
        >

        <label for="user">Username</label>
        <input
          id="user"
          type="text"
          autocomplete="off"
          placeholder="Choose a username"
          required
        >

        <label for="pass">Password</label>
        <input
          id="pass"
          type="password"
          autocomplete="new-password"
          placeholder="Choose a password"
          required
        >

        <button id="go" type="submit">Create account</button>
      </form>

      <div id="msg" class="msg" role="status" aria-live="polite"></div>
      <a href="/" class="back-link">
        &larr; Back to Mailcheck
      </a>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    $('createForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const msg = $('msg');
      const button = $('go');

      msg.className = 'msg';
      msg.textContent = 'Working…';
      button.disabled = true;
      button.textContent = 'Creating account…';

      try {
        const username = $('user').value.trim().toLowerCase();

        const res = await fetch('/api/setup/create-user', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Key': $('key').value
          },
          body: JSON.stringify({
            username,
            password: $('pass').value
          })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.error || 'Request failed.');
        }

        msg.textContent = `Created "${username}".`;
        $('user').value = '';
        $('pass').value = '';

      } catch (error) {
        msg.className = 'msg err';
        msg.textContent = error.message || 'Something went wrong.';
      } finally {
        button.disabled = false;
        button.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
